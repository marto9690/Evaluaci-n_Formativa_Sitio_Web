<h2> Datos Personales</h2>

<form action="" method="get">
<form class="row g-3 needs-validation" novalidate>
  <div class="col-md-4">
    <label for="validationCustom01" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="validationCustom01" value="" required>
    <div class="valid-feedback">
      Nombre guardado correctamente!
    </div>
  </div>
  <div class="col-md-4">
    <label for="validationCustom02" class="form-label">Apellido</label>
    <input type="text" class="form-control" id="validationCustom02" value="" required>
    <div class="valid-feedback">
      Apellido guardado correctamente!
    </div>
  <form action="" method="get">
  <label for="email">Correo electrónico:</label>
  <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"><br><br>
  <input type="submit" value="Enviar">
<form>
  <div class="mb-3">
    <div id="emailHelp" class="form-text">No compartiremos tu correo con nadie más.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
  </div>
  <button type="submit" class="btn btn-primary">Enviar</button>
  <div class="col-md-3">
    <label for="validationCustom04" class="form-label">Region</label>
    <select class="form-select" id="validationCustom04" required>
      <option selected disabled value="">Elija una región...</option>
      <option>...</option>

        <option>Tarapacá</option>

        <option>Metropolitana de Santiago</option>
        <option>O'Higgins</option>
        <option>Maule</option>
        <option>Ñuble</option>
        <option>Biobío</option>
        <option>La Araucanía</option>
        <option>Los Ríos</option>
        <option>Los Lagos</option>
        <option>Aysén</option>
        <option>Magallanes</option>
    </select>
    <div class="invalid-feedback">
      Porfavor seleccione una region valida.
    </div>
<form>
  <label for="fnac">Fecha de Nacimiento:</label>
  <input type="date" id="fnac" name="fecha_nacimiento">
</form>

  </div>
  <div class="col-md-3">
    <label for="validationCustom05" class="form-label">Teléfono</label>
    <input type="number" class="form-label" id="validationCustom05" required>
    <div class="invalid-feedback">
      Porfavor ingrese un número de teléfono valido.
    </div>
  </div>    

</form><br><br>
