<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora | GOAT</title>

    <link rel="icon" href="../img/Universidad-de-los-Lagos.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f1f3f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #071b35, #123d68);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 0;
        }

        nav {
            background-color: #071b35;
            padding: 15px;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #e5b642;
        }

        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65vh;
            padding: 40px 20px;
        }

        .calculadora {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .calculadora h2 {
            color: #123d68;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .calculadora input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .botones button {
            background-color: #123d68;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .botones button:hover {
            background-color: #e5b642;
            color: #071b35;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #f1f3f5;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #123d68;
            min-height: 55px;
        }

        footer {
            background-color: #071b35;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer p {
            margin: 5px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }

            .calculadora {
                padding: 25px 20px;
            }

            nav ul {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Calculadora</h1>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="acerca_de.html">Acerca de</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="formulario.html">Formulario</a></li>
            <li><a href="ejemploJS.html">Ampolleta</a></li>
            <li><a href="json.html">JSON</a></li>
            <li><a href="googlesheet.html">Google Sheet</a></li>
        </ul>
    </nav>

    <main class="contenedor">

        <div class="calculadora">

            <h2>Operaciones matemáticas</h2>

            <input type="number" id="num1" placeholder="Ingrese el primer número">

            <input type="number" id="num2" placeholder="Ingrese el segundo número">

            <div class="botones">
                <button onclick="sumar()">Sumar (+)</button>
                <button onclick="restar()">Restar (-)</button>
                <button onclick="multiplicar()">Multiplicar (×)</button>
                <button onclick="dividir()">Dividir (÷)</button>
            </div>

            <p id="resultado">El resultado aparecerá aquí</p>

        </div>

    </main>

    <footer>
        <p>Derechos reservados &copy; 2026</p>
        <p>Martin Avilés</p>
    </footer>

    <script src="../js/funciones.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
