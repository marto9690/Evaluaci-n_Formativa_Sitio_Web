<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejemplo JavaScript | GOAT</title>

    <link rel="icon" href="../img/Universidad-de-los-Lagos.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f1f3f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #071b35, #123d68);
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 2.7rem;
            font-weight: bold;
            margin: 0;
        }

        nav {
            background-color: #071b35;
            padding: 15px;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #e5b642;
        }

        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65vh;
            padding: 40px 20px;
        }

        .tarjeta {
            background-color: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        .tarjeta h2 {
            color: #123d68;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .tarjeta p {
            color: #666;
            margin-bottom: 25px;
        }

        .imagen-ampolleta {
            width: 180px;
            height: 220px;
            object-fit: contain;
            margin: 15px auto 25px;
            display: block;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .botones button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }

        .btn-encender {
            background-color: #198754;
        }

        .btn-encender:hover {
            background-color: #146c43;
        }

        .btn-apagar {
            background-color: #dc3545;
        }

        .btn-apagar:hover {
            background-color: #bb2d3b;
        }

        footer {
            background-color: #071b35;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        footer p {
            margin: 5px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }

            .tarjeta {
                padding: 25px 15px;
            }

            .botones {
                flex-direction: column;
            }

            .botones button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Ejemplo de JavaScript</h1>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="acerca_de.html">Acerca de</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="formulario.html">Formulario</a></li>
            <li><a href="calculadora.html">Calculadora</a></li>
            <li><a href="json.html">JSON</a></li>
            <li><a href="googlesheet.html">Google Sheet</a></li>
        </ul>
    </nav>

    <main class="contenedor">

        <div class="tarjeta">

            <h2>Control de ampolleta</h2>

            <p>
                Utiliza los botones para encender y apagar la ampolleta
                mediante JavaScript.
            </p>

            <img
                id="imgEncendida"
                class="imagen-ampolleta"
                src="../img/encendida.jpg"
                alt="Ampolleta encendida">

            <div class="botones">

                <button class="btn-encender" onclick="encenderAmpolleta()">
                    Encender ampolleta
                </button>

                <button class="btn-apagar" onclick="apagarAmpolleta()">
                    Apagar ampolleta
                </button>

            </div>

        </div>

    </main>

    <footer>
        <p>Derechos reservados &copy; 2026</p>
        <p>Martin Avilés</p>
    </footer>

    <script src="../js/funciones.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
